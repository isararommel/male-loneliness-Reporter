# Edge nginx vhost for dickpic-anzeige.isararommel.de
#
# IMPORTANT: deliberately does NOT include your Authelia auth_request
# snippet/location that your other vhosts use. This site must stay
# reachable without login, since it's meant for anonymous visitors.
# Do not copy an "include .../authelia-location.conf;" or
# "auth_request /authelia;" line into this file.
#
# Adjust to match your actual conventions:
#   - server_name / cert paths (this assumes certbot's default layout;
#     swap for however you already issue certs on this host)
#   - proxy_pass target: container name (if edge nginx is on the same
#     Docker network) or 127.0.0.1:8091 (if edge nginx runs on the host)

server {
    listen 80;
    server_name dickpic-anzeige.isararommel.de;

    # Needed for certbot's webroot HTTP-01 challenge on first issuance —
    # keep this above the redirect, otherwise the challenge request gets
    # bounced to https before a certificate exists.
    location /.well-known/acme-challenge/ {
        root /pfad/zu/eurem/acme-webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dickpic-anzeige.isararommel.de;

    ssl_certificate     /etc/letsencrypt/live/dickpic-anzeige.isararommel.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dickpic-anzeige.isararommel.de/privkey.pem;

    # No Authelia auth_request here on purpose — see note above.

    location / {
        proxy_pass http://dickpic-anzeige:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
